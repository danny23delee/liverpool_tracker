name: Build, test and deploy

# Weekly refresh (Tuesday 06:00 UTC), on demand, and on pushes to main.
# The site is only deployed if every test passes; otherwise the last good deployment stays live.
on:
  schedule:
    - cron: "0 6 * * 2"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # Raw responses are cached between runs, so only new matches are fetched after the first run. The first run
      # downloads about 750 files for Liverpool plus about 490 match files for each of the other four clubs (a match between
      # two tracked clubs is fetched once), at one request per second: roughly 45 minutes in total.
      - name: Restore raw data cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: raw-v1-${{ github.run_id }}
          restore-keys: raw-v1-

      - name: ETL (fetch, cache, clean, join) for every club
        run: python etl.py

      - name: Test pipeline, metrics, club configuration and payload (every club)
        run: python -m pytest tests/test_etl.py tests/test_metrics.py tests/test_style.py tests/test_build.py tests/test_clubs.py -q

      - name: Build dist/ (Liverpool at the root, one folder per other club)
        run: python build.py

      - name: Save raw data cache (even if a later step failed, so a long first fetch is not lost)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: raw-v1-${{ github.run_id }}

      - name: Share the build with the browser test jobs
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: |
            dist
            data/processed
          retention-days: 1

  # The full browser suite runs against each club's page, in parallel.
  frontend:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        club: [liverpool, arsenal, chelsea, manchester-united, manchester-city]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: site
      - name: Test the built page in a real browser
        run: python -m pytest tests/test_frontend.py -q
        env:
          TRACKER_CLUB: ${{ matrix.club }}
      - name: Keep screenshots for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.club }}
          path: artifacts/screenshots
          if-no-files-found: ignore
          retention-days: 14

  # The club switcher and per-club themes, across all five built pages.
  switcher:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: site
      - run: python -m pytest tests/test_switcher.py -q
      - name: Keep screenshots for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-clubs
          path: artifacts/screenshots
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    needs: [build, frontend, switcher]   # skipped automatically if any job above failed: the last good site stays live
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
